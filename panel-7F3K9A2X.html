<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin - Menú</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0b1a33;
  color: white;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
}

.menu {
  display: grid;
  gap: 15px;
  max-width: 400px;
  margin: auto;
}

.menu button {
  padding: 15px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  font-weight: bold;
}

.pendientes { background: orange; }
.aprobadas { background: #00c853; }
.rechazadas { background: #ff5252; }
.buscar { background: #03a9f4; }
.salir { background: #777; }
</style>
</head>
<body>

<h1>🛠 Panel Administrativo</h1>

<div class="menu">
  <button class="pendientes" onclick="ir('admin-pendientes.html')">⏳ Compras por aprobar</button>
  <button class="aprobadas" onclick="ir('admin-aprobadas.html')">✅ Compras aprobadas</button>
  <button class="rechazadas" onclick="ir('admin-rechazadas.html')">❌ Compras rechazadas</button>
  <button class="buscar" onclick="ir('admin-buscar.html')">🔍 Verificar ticket</button>
  <button class="salir" onclick="salir()">🚪 Cerrar sesión</button>
</div>

<script>
// 🔐 PROTECCIÓN LOGIN
if (localStorage.getItem("admin_auth") !== "ok") {
  location.href = "login.html";
}

function ir(p) {
  location.href = p;
}

function salir() {
  localStorage.removeItem("admin_auth");
  location.href = "login.html";
}
</script>

</body>
</html>
