<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #0b1a33;
  color: white;
  margin: 0;
  padding: 15px;
}

h1 {
  text-align: center;
}

.menu {
  display: grid;
  grid-template-columns: 1fr;
  gap: 15px;
  max-width: 400px;
  margin: auto;
}

button {
  padding: 15px;
  font-size: 18px;
  border-radius: 10px;
  border: none;
  font-weight: bold;
}

.pendientes { background: orange; }
.aprobadas { background: #00c853; }
.rechazadas { background: #ff5252; }
.buscar { background: #03a9f4; }
.salir { background: #777; }
</style>
</head>
<body>

<h1>🛠 Panel de Administración</h1>

<div class="menu">
  <button class="pendientes" onclick="ir('admin-pendientes.html')">⏳ Compras por aprobar</button>
  <button class="aprobadas" onclick="ir('admin-aprobadas.html')">✅ Compras aprobadas</button>
  <button class="rechazadas" onclick="ir('admin-rechazadas.html')">❌ Compras rechazadas</button>
  <button class="buscar" onclick="ir('admin-buscar-ticket.html')">🔍 Buscar ticket</button>
  <button class="salir" onclick="salir()">🚪 Cerrar sesión</button>
</div>

<script>
// 🔐 PROTECCIÓN
if (localStorage.getItem("admin_auth") !== "ok") {
  location.href = "login.html";
}

function ir(p) {
  location.href = p;
}

function salir() {
  localStorage.removeItem("admin_auth");
  location.href = "login.html";
}
</script>

</body>
</html>
