<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin Coroto de la Suerte</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0b1a33;
  color: white;
  margin: 0;
  padding: 15px;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

h2 {
  margin-top: 30px;
  border-bottom: 1px solid #2a3f6f;
  padding-bottom: 5px;
}

.compra {
  background: #122654;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 15px;
}

.estado {
  font-weight: bold;
}

.pendiente { color: orange; }
.aprobado { color: #00ff88; }
.rechazado { color: #ff5252; }

.botones {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.botones button {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
}

.aprobar { background: #00c853; }
.rechazar { background: #ff5252; }

img {
  width: 100%;
  border-radius: 8px;
  margin-top: 10px;
}

input {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: none;
  margin-bottom: 10px;
}
</style>
</head>
<body>

<h1>🛠 ADMIN - Coroto de la Suerte</h1>

<h2>⏳ Compras por aprobar</h2>
<div id="pendientes"></div>

<h2>✅ Compras aprobadas</h2>
<div id="aprobadas"></div>

<h2>❌ Compras rechazadas</h2>
<div id="rechazadas"></div>

<h2>🔎 Buscar ticket ganador</h2>
<input id="buscarTicket" placeholder="Ej: 0001">
<button onclick="buscarTicket()">Buscar</button>
<div id="resultadoTicket"></div>

<script>
// ================= SUPABASE =================
const supabaseUrl = "https://hedwnykwnhrbnwfohntr.supabase.co";
const supabaseKey = "sb_publishable_6otGMCrLs0wEi2_X5FwEmw__DDh9kRM";
const supa = supabase.createClient(supabaseUrl, supabaseKey);

// ================= CARGAR COMPRAS =================
async function cargar() {
  const { data, error } = await supa
    .from("purchases")
    .select("*")
    .order("id", { ascending: false });

  if (error) {
    alert("Error cargando compras");
    console.error(error);
    return;
  }

  document.getElementById("pendientes").innerHTML = "";
  document.getElementById("aprobadas").innerHTML = "";
  document.getElementById("rechazadas").innerHTML = "";

  for (const c of data) {
    const estadoClass =
      c.status === "pending" ? "pendiente" :
      c.status === "approved" ? "aprobado" :
      "rechazado";

    // Buscar tickets de esta compra
    const { data: tickets } = await supa
      .from("tickets")
      .select("ticket_number")
      .eq("purchase_id", c.id);

    const listaTickets = tickets && tickets.length
      ? tickets.map(t => t.ticket_number).join(", ")
      : "N/A";

    const card = document.createElement("div");
    card.className = "compra";

    card.innerHTML = `
      <p><b>👤 Nombre:</b> ${c.name}</p>
      <p><b>📞 Teléfono:</b> ${c.phone}</p>
      <p><b>💳 Referencia:</b> ${c.reference}</p>
      <p><b>🎟 Cantidad:</b> ${c.tickets_count}</p>
      <p><b>🎫 Números:</b> ${listaTickets}</p>
      <p><b>📌 Estado:</b> <span class="estado ${estadoClass}">${c.status}</span></p>

      <a href="${c.image_url}" target="_blank">
        <img src="${c.image_url}">
      </a>

      ${c.status === "pending" ? `
      <div class="botones">
        <button class="aprobar" onclick="aprobar(${c.id})">✅ Aprobar</button>
        <button class="rechazar" onclick="rechazar(${c.id})">❌ Rechazar</button>
      </div>
      ` : ``}
    `;

    if (c.status === "pending") {
      document.getElementById("pendientes").appendChild(card);
    } else if (c.status === "approved") {
      document.getElementById("aprobadas").appendChild(card);
    } else {
      document.getElementById("rechazadas").appendChild(card);
    }
  }
}

// ================= APROBAR =================
async function aprobar(id) {
  if (!confirm("¿Aprobar esta compra?")) return;

  await supa.from("purchases")
    .update({ status: "approved" })
    .eq("id", id);

  await supa.from("tickets")
    .update({ status: "sold" })
    .eq("purchase_id", id);

  alert("✅ Compra aprobada");
  cargar();
}

// ================= RECHAZAR =================
async function rechazar(id) {
  if (!confirm("¿Rechazar esta compra y liberar tickets?")) return;

  await supa.from("tickets")
    .update({ status: "available", purchase_id: null })
    .eq("purchase_id", id);

  await supa.from("purchases")
    .update({ status: "rejected" })
    .eq("id", id);

  alert("❌ Compra rechazada");
  cargar();
}

// ================= BUSCAR TICKET =================
async function buscarTicket() {
  const numero = document.getElementById("buscarTicket").value.trim();
  if (!numero) return;

  const { data, error } = await supa
    .from("tickets")
    .select("ticket_number, purchases(*)")
    .eq("ticket_number", numero)
    .single();

  const div = document.getElementById("resultadoTicket");

  if (error || !data) {
    div.innerHTML = "<p>❌ Ticket no encontrado</p>";
    return;
  }

  if (!data.purchases) {
    div.innerHTML = "<p>⚠️ Ese ticket no está vendido</p>";
    return;
  }

  const c = data.purchases;

  div.innerHTML = `
    <div class="compra">
      <p><b>🎫 Ticket:</b> ${data.ticket_number}</p>
      <p><b>👤 Nombre:</b> ${c.name}</p>
      <p><b>📞 Teléfono:</b> ${c.phone}</p>
      <p><b>💳 Referencia:</b> ${c.reference}</p>
      <p><b>📌 Estado:</b> ${c.status}</p>
    </div>
  `;
}

// ================= INIT =================
cargar();
</script>

</body>
</html>
