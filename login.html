<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background: #0b1a33;
  color: white;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.box {
  background: #122654;
  padding: 30px;
  border-radius: 12px;
  width: 100%;
  max-width: 350px;
}

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}

button {
  background: #00c853;
  font-weight: bold;
}
</style>
</head>
<body>

<div class="box">
  <h2>🔐 Panel Administrativo</h2>
  <input id="user" placeholder="Usuario">
  <input id="pass" type="password" placeholder="Contraseña">
  <button onclick="login()">Entrar</button>
</div>

<script>
function login() {
  const u = document.getElementById("user").value;
  const p = document.getElementById("pass").value;

  // 🔐 CAMBIA ESTOS DATOS A LOS TUYOS
  const USER = "admin";
  const PASS = "123456";

  if (u === USER && p === PASS) {
    localStorage.setItem("admin_auth", "ok");
    location.href = "panel-7F3K9A2X.html"; // ⚠️ NO CAMBIES ESTE NOMBRE
  } else {
    alert("❌ Usuario o contraseña incorrectos");
  }
}
</script>

</body>
</html>
