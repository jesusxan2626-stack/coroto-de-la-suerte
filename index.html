<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Coroto de la Suerte</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #0b1a33;
    color: white;
}

header {
    background: #08162f;
    padding: 16px;
    text-align: center;
    font-weight: bold;
    font-size: 22px;
}

.container {
    max-width: 420px;
    margin: auto;
    padding: 15px;
}

.card {
    background: #122654;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 15px;
}

.title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 10px;
}

.price {
    font-size: 18px;
    margin-bottom: 10px;
}

.progress-container {
    background: #1c2f5a;
    border-radius: 20px;
    overflow: hidden;
    height: 18px;
    margin: 10px 0;
}

.progress-bar {
    background: linear-gradient(90deg, #00ff6a, #00c853);
    width: 0%;
    height: 100%;
    transition: width 0.6s ease;
}

.btn {
    display: block;
    width: 100%;
    text-align: center;
    background: linear-gradient(90deg, #00ff6a, #00c853);
    color: #000;
    padding: 16px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    text-decoration: none;
}

.premio {
    width: 100%;
    border-radius: 12px;
    margin-bottom: 10px;
    animation: flotar 3s ease-in-out infinite;
}

@keyframes flotar {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
    100% { transform: translateY(0px); }
}

.footer {
    text-align: center;
    font-size: 13px;
    color: #aaa;
    margin-top: 20px;
}
</style>
</head>

<body>

<header>🍀 Coroto de la Suerte</header>

<div class="container">

    <div class="card">
        <div class="title">🎁 Gran Rifa Activa</div>

        <!-- IMAGEN DEL PREMIO -->
        <img src="premio.jpg" class="premio">

        <div class="price">💰 Precio por ticket: <b>520,00 Bs</b></div>

        <!-- BARRA -->
        <div class="progress-container">
            <div class="progress-bar" id="barra"></div>
        </div>

        <div id="textoPorcentaje" style="text-align:center; margin-bottom:10px;">
            Cargando progreso...
        </div>

        <a class="btn" href="comprar.html">COMPRAR TICKETS</a>
    </div>

    <div class="footer">
        Plataforma de rifas online • 2026
    </div>

</div>

<script>
const supabaseUrl = "https://hedwnykwnhrbnwfohntr.supabase.co";
const supabaseKey = "sb_publishable_6otGMCrLs0wEi2_X5FwEmw__DDh9kRM";
const supabase = supabase.createClient(supabaseUrl, supabaseKey);

// CONFIG
const TOTAL_TICKETS = 10000;

async function cargarProgreso() {
    const { data, error } = await supabase
        .from("purchases")
        .select("id", { count: "exact" });

    if (error) {
        console.error(error);
        return;
    }

    const vendidos = data.length;
    const porcentaje = Math.min((vendidos / TOTAL_TICKETS) * 100, 100);

    document.getElementById("barra").style.width = porcentaje + "%";
    document.getElementById("textoPorcentaje").innerText =
        Math.round(porcentaje) + "% del sorteo completado";
}

cargarProgreso();

// Se actualiza cada 30 segundos solo
setInterval(cargarProgreso, 30000);
</script>

</body>
</html>
