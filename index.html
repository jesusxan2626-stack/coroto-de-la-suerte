<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Coroto de la Suerte</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      text-align: center;
    }
    header {
      background: #111;
      padding: 15px;
      font-size: 22px;
      font-weight: bold;
    }
    .card {
      background: #151515;
      margin: 20px;
      padding: 20px;
      border-radius: 10px;
    }
    button {
      background: #00c853;
      border: none;
      padding: 15px 25px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }
    .tickets {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      margin-top: 15px;
    }
    .ticket {
      background: #222;
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<header>🍀 Coroto de la Suerte</header>

<div class="card">
  <h2>🎁 Rifa activa</h2>
  <p>Precio por ticket: <b>360 Bs</b></p>
  <p>Total tickets: <b>10.000</b></p>
  <p>Estado: <b id="estado">Disponible</b></p>
  <br>
  <button onclick="comprar()">Comprar tickets</button>
</div>

<div class="card">
  <h3>🎟️ Tickets generados</h3>
  <div class="tickets" id="listaTickets"></div>
</div>

<script>
function comprar() {
  const cantidad = 5;
  const contenedor = document.getElementById("listaTickets");
  for (let i = 0; i < cantidad; i++) {
    const num = Math.floor(1000 + Math.random() * 9000);
    const div = document.createElement("div");
    div.className = "ticket";
    div.textContent = num;
    contenedor.appendChild(div);
  }
}
</script>

</body>
</html>
