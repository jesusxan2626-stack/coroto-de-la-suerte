<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Comprar Tickets</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0b1a33;
  color: white;
  margin: 0;
  padding: 15px;
}

h1 {
  text-align: center;
}

.tickets {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
  gap: 10px;
  margin-bottom: 20px;
}

.ticket {
  padding: 12px;
  border-radius: 8px;
  text-align: center;
  background: #1c2f5c;
  cursor: pointer;
}

.ticket.selected {
  background: #00c853;
  color: black;
}

.resumen {
  background: #122654;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 20px;
}

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}

button {
  background: #00c853;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>
<body>

<h1>🎟 Comprar Tickets</h1>

<div class="tickets" id="tickets"></div>

<div class="resumen">
  <p>🎫 Tickets seleccionados: <b id="count">0</b></p>
  <p>💰 Total: <b>$<span id="total">0</span></b></p>

  <input id="name" placeholder="Nombre completo">
  <input id="phone" placeholder="Teléfono">
  <input id="reference" placeholder="Referencia de pago">
  <input id="image_url" placeholder="Link del comprobante (imagen)">

  <button onclick="comprar()">Comprar</button>
</div>

<script>
// ================= SUPABASE =================
const supabaseUrl = "https://hedwnykwnhrbnwfohntr.supabase.co";
const supabaseKey = "sb_publishable_6otGMCrLs0wEi2_X5FwEmw__DDh9kRM";
const supa = supabase.createClient(supabaseUrl, supabaseKey);

// ================= CONFIG =================
// ⬇️⬇️⬇️ CAMBIA SOLO ESTE NÚMERO ⬇️⬇️⬇️
const RAFFLE_ID = 1; // ← el id BIGINT real de raffles_new

let ticketPrice = 0;
let selected = [];

// ================= CARGAR RIFA =================
async function cargarRifa() {
  const { data, error } = await supa
    .from("raffles_new")
    .select("*")
    .eq("id", RAFFLE_ID)
    .single();

  if (error || !data) {
    alert("❌ Error cargando la rifa");
    console.error(error);
    return;
  }

  ticketPrice = Number(data.price);
}

// ================= CARGAR TICKETS =================
async function cargarTickets() {
  const { data, error } = await supa
    .from("tickets")
    .select("id, ticket_number")
    .eq("raffle_id", RAFFLE_ID)
    .eq("status", "available")
    .order("ticket_number");

  if (error) {
    alert("❌ Error cargando tickets");
    console.error(error);
    return;
  }

  const cont = document.getElementById("tickets");
  cont.innerHTML = "";

  data.forEach(t => {
    const d = document.createElement("div");
    d.className = "ticket";
    d.textContent = t.ticket_number;

    d.onclick = () => toggleTicket(t.ticket_number, d);

    cont.appendChild(d);
  });
}

// ================= SELECCIONAR =================
function toggleTicket(num, el) {
  if (selected.includes(num)) {
    selected = selected.filter(n => n !== num);
    el.classList.remove("selected");
  } else {
    selected.push(num);
    el.classList.add("selected");
  }

  document.getElementById("count").textContent = selected.length;
  document.getElementById("total").textContent = selected.length * ticketPrice;
}

// ================= COMPRAR =================
async function comprar() {
  if (selected.length === 0) {
    alert("Selecciona al menos un ticket");
    return;
  }

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const reference = document.getElementById("reference").value.trim();
  const image_url = document.getElementById("image_url").value.trim();

  if (!name || !phone || !reference) {
    alert("Completa todos los datos");
    return;
  }

  // 1️⃣ Crear compra
  const { data: purchase, error: err1 } = await supa
    .from("purchases_new")
    .insert({
      name,
      phone,
      reference,
      image_url,
      tickets_count: selected.length,
      raffle_id: RAFFLE_ID,
      status: "pending"
    })
    .select()
    .single();

  if (err1) {
    alert("❌ Error creando compra");
    console.error(err1);
    return;
  }

  // 2️⃣ Reservar tickets
  const { error: err2 } = await supa.rpc("reserve_tickets", {
    p_raffle_id: RAFFLE_ID,
    p_quantity: selected.length,
    p_purchase_id: purchase.id
  });

  if (err2) {
    alert("❌ Error reservando tickets");
    console.error(err2);
    return;
  }

  alert("✅ Compra enviada correctamente");
  location.reload();
}

// ================= INIT =================
cargarRifa();
cargarTickets();
</script>

</body>
</html>
