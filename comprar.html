<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Comprar Tickets</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }
    button {
      background: #28a745;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:disabled {
      background: #999;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Comprar Tickets</h2>

    <label>Cantidad de tickets</label>
    <input type="number" id="quantity" min="1" value="1" />

    <label>Teléfono</label>
    <input type="text" id="phone" />

    <label>Email</label>
    <input type="email" id="email" />

    <label>Referencia de pago</label>
    <input type="text" id="reference" />

    <label>Link de imagen del comprobante</label>
    <input type="text" id="image_url" />

    <button id="buyBtn">Comprar</button>

    <p id="msg"></p>
  </div>

  <script>
    // 🔐 SUPABASE (TU PROYECTO)
    const supabaseUrl = 'https://hedwnykwnhrbnwfohntr.supabase.co';
    const supabaseKey = 'sb_publishable_6otGMCrLs0wEi2_X5FwEmw__DDh9kRM';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // 📌 ID DE LA RIFA (BIGINT)
    const RAFFLE_ID = 1; // ← tu rifa existente

    const buyBtn = document.getElementById('buyBtn');
    const msg = document.getElementById('msg');

    buyBtn.addEventListener('click', async () => {
      buyBtn.disabled = true;
      msg.innerText = 'Procesando compra...';

      const quantity = parseInt(document.getElementById('quantity').value);
      const phone = document.getElementById('phone').value;
      const email = document.getElementById('email').value;
      const reference = document.getElementById('reference').value;
      const image_url = document.getElementById('image_url').value;

      try {
        // 1️⃣ CREAR COMPRA
        const { data: purchase, error: purchaseError } = await supabase
          .from('purchases_new')
          .insert([{
            phone,
            email,
            reference,
            amount: quantity,
            status: 'pending',
            image_url,
            tickets_count: quantity
          }])
          .select()
          .single();

        if (purchaseError) throw purchaseError;

        const purchaseId = purchase.id;

        // 2️⃣ RESERVAR TICKETS
        const { error: reserveError } = await supabase.rpc('reserve_tickets', {
          p_raffle_id: RAFFLE_ID,
          p_quantity: quantity,
          p_purchase_id: purchaseId
        });

        if (reserveError) throw reserveError;

        msg.innerText = '✅ Compra enviada correctamente';
      } catch (err) {
        console.error(err);
        msg.innerText = '❌ Error al enviar la compra';
      } finally {
        buyBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
