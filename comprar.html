<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Comprar Tickets</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0b1a33;
  color: white;
  margin: 0;
  padding: 15px;
}

.card {
  background: #122654;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 15px;
}

h1, h2 {
  text-align: center;
}

.tickets-box {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  font-size: 28px;
}

.tickets-box button {
  width: 60px;
  height: 60px;
  font-size: 30px;
  border-radius: 10px;
  border: none;
}

.total {
  text-align: center;
  font-size: 28px;
  color: #00ff88;
}

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
  font-size: 18px;
}

.btn {
  background: #00c853;
  color: black;
  font-weight: bold;
}
</style>
</head>
<body>

<h1>🎟 Comprar Tickets</h1>

<div class="card">
  <h2>Selecciona la cantidad</h2>

  <div class="tickets-box">
    <button onclick="cambiar(-1)">-</button>
    <span id="cantidad">1</span>
    <button onclick="cambiar(1)">+</button>
  </div>

  <p class="total">Total: <span id="total">360</span> Bs</p>
</div>

<div class="card">
  <h2>🏦 Datos de pago</h2>
  <p><b>Pago móvil:</b> 04264463109</p>
  <p><b>Cédula:</b> V-3.690.403</p>
  <p><b>Banco:</b> Banco Venezuela</p>
</div>

<div class="card">
  <h2>📤 Enviar comprobante</h2>

  <input id="nombre" placeholder="Nombre completo">
  <input id="telefono" placeholder="Teléfono">
  <input id="mail" placeholder="Correo">
  <input id="referencia" placeholder="Últimos 4 dígitos">

  <input id="comprobante" type="file" accept="image/*">

  <button class="btn" onclick="enviar()">Enviar comprobante</button>
</div>

<script>
const precio = 360;
let cantidad = 1;

// Inicializar
document.getElementById("cantidad").innerText = cantidad;
document.getElementById("total").innerText = cantidad * precio;

// Botones + -
function cambiar(valor) {
  cantidad = cantidad + valor;
  if (cantidad < 1) cantidad = 1;

  document.getElementById("cantidad").innerText = cantidad;
  document.getElementById("total").innerText = cantidad * precio;
}

// ================= SUPABASE ==================
const supabaseUrl = "PON_AQUI_TU_URL";
const supabaseKey = "PON_AQUI_TU_KEY";
const supabase = supabase.createClient(supabaseUrl, supabaseKey);

// ================= ENVIAR ==================
async function enviar() {

  const nombre = document.getElementById("nombre").value;
  const telefono = document.getElementById("telefono").value;
  const correo = document.getElementById("mail").value;
  const referencia = document.getElementById("referencia").value;
  const cantidadTickets = cantidad;
  const total = cantidad * precio;
  const comprobante = document.getElementById("comprobante").files[0];

  if (!nombre || !telefono || !referencia || !comprobante) {
    alert("⚠️ Por favor completa todos los datos y sube el comprobante.");
    return;
  }

  // 1️⃣ Subir imagen
  const nombreArchivo = Date.now() + "_" + comprobante.name;

  const { error: uploadError } = await supabase
    .storage
    .from("comprobantes")
    .upload(nombreArchivo, comprobante);

  if (uploadError) {
    alert("❌ Error subiendo la imagen");
    console.log(uploadError);
    return;
  }

  // 2️⃣ Obtener URL
  const { data: publicUrlData } = supabase
    .storage
    .from("comprobantes")
    .getPublicUrl(nombreArchivo);

  const imagenUrl = publicUrlData.publicUrl;

  // 3️⃣ Guardar en tabla
  const { error: insertError } = await supabase
    .from("compras")
    .insert([{
      nombre,
      telefono,
      correo,
      referencia,
      cantidad: cantidadTickets,
      total: total,
      imagen: imagenUrl,
      estado: "pendiente"
    }]);

  if (insertError) {
    alert("❌ Error guardando la compra");
    console.log(insertError);
    return;
  }

  // 4️⃣ Mensaje final
  alert(
    "✅ ¡Gracias por tu compra!\n\n" +
    "Hemos recibido tu comprobante correctamente.\n\n" +
    "En un plazo máximo de 24 horas tu pago será verificado y tus tickets serán activados en el sistema.\n\n" +
    "Podrás consultarlos en nuestro verificador de tickets usando tu cédula.\n\n" +
    "¡Mucha suerte! 🍀"
  );

  // 5️⃣ Limpiar
  document.getElementById("nombre").value = "";
  document.getElementById("telefono").value = "";
  document.getElementById("mail").value = "";
  document.getElementById("referencia").value = "";
  document.getElementById("comprobante").value = "";
}
</script>

</body>
</html>
