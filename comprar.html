<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Comprar Tickets</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #0b1a33;
  color: white;
  margin: 0;
  padding: 15px;
}

.card {
  background: #122654;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 15px;
}

h1, h2 {
  text-align: center;
}

.total {
  text-align: center;
  font-size: 28px;
  color: #00ff88;
}

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
  font-size: 18px;
}

.btn {
  background: #00c853;
  color: black;
  font-size: 18px;
  font-weight: bold;
}
</style>
</head>
<body>

<h1>🎟 Comprar Tickets</h1>

<div class="card">
  <h2>Selecciona la cantidad de tickets</h2>

  <input 
    id="cantidad" 
    type="number" 
    min="1" 
    value="1"
    oninput="calcular()"
  >

  <p class="total">Total: <span id="total">360</span> Bs</p>
</div>

<div class="card">
  <h2>🏦 Datos de pago</h2>
  <p><b>Pago móvil:</b> 04264463109</p>
  <p><b>Cédula:</b> V-3.690.403</p>
  <p><b>Banco:</b> Banco Venezuela</p>
</div>

<div class="card">
  <h2>📤 Enviar comprobante</h2>

  <input placeholder="Nombre completo">
  <input placeholder="Teléfono">
  <input placeholder="Correo">
  <input placeholder="Últimos 4 dígitos de referencia">

  <input type="file" accept="image/*">

  <button class="btn" onclick="enviar()">Enviar comprobante</button>
</div>

<script>
const precio = 360;

function calcular() {
  let cantidad = document.getElementById("cantidad").value;

  if (cantidad < 1) {
    cantidad = 1;
    document.getElementById("cantidad").value = 1;
  }

  document.getElementById("total").innerText = cantidad * precio;
}

// Inicializar
calcular();

function enviar() {
  alert(
    "✅ ¡Gracias por tu compra!\n\n" +
    "Hemos recibido tu comprobante correctamente.\n\n" +
    "En un plazo máximo de 24 horas tu pago será verificado y tus tickets serán activados en el sistema.\n\n" +
    "Podrás consultarlos en nuestro verificador de tickets usando tu cédula.\n\n" +
    "¡Mucha suerte! 🍀"
  );
}
</script>

</body>
</html>
