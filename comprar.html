<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Comprar Tickets</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  background:#0b1a33;
  color:white;
  font-family:Arial, sans-serif;
  padding:15px;
  margin:0;
}
.card {
  background:#122654;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}
h1,h2 { text-align:center; }
input,button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:none;
  font-size:16px;
}
button {
  background:#00c853;
  font-weight:bold;
}
.total {
  text-align:center;
  font-size:22px;
  color:#00ff88;
}
</style>
</head>

<body>

<h1>🎟 Comprar Tickets</h1>

<div class="card">
  <h2>Cantidad</h2>
  <input type="number" id="cantidad" min="1" max="50" value="1">
  <p class="total">Total: <span id="total">520</span> Bs</p>
</div>

<div class="card">
  <h2>Datos</h2>
  <input id="nombre" placeholder="Nombre completo">
  <input id="telefono" placeholder="Teléfono">
  <input id="correo" placeholder="Correo (opcional)">
  <input id="referencia" placeholder="Últimos 4 dígitos">
  <input type="file" id="comprobante" accept="image/*">
  <button onclick="enviar()">Comprar</button>
</div>

<script>
const PRECIO = 520;
const RAFFLE_ID = 1;

// SUPABASE (FIJO)
const supabaseUrl = "https://hedwnykwnhrbnwfohntr.supabase.co";
const supabaseKey = "sb_publishable_6otGMCrLs0wEi2_X5FwEmw__DDh9kRM";
const supa = supabase.createClient(supabaseUrl, supabaseKey);

const cantidadInput = document.getElementById("cantidad");
const totalSpan = document.getElementById("total");

cantidadInput.addEventListener("input", () => {
  totalSpan.innerText = cantidadInput.value * PRECIO;
});

async function enviar() {
  const nombreVal = document.getElementById("nombre").value.trim();
  const telefonoVal = document.getElementById("telefono").value.trim();
  const correoVal = document.getElementById("correo").value.trim();
  const referenciaVal = document.getElementById("referencia").value.trim();
  const file = document.getElementById("comprobante").files[0];
  const cantidad = parseInt(cantidadInput.value);

  if (!nombreVal || !telefonoVal || !referenciaVal || !file) {
    alert("⚠️ Completa todos los datos");
    return;
  }

  try {
    // 1️⃣ Subir imagen
    const fileName = crypto.randomUUID() + "_" + file.name;
    const upload = await supa.storage
      .from("comprobantes")
      .upload(fileName, file);

    if (upload.error) throw upload.error;

    const { data: img } = supa.storage
      .from("comprobantes")
      .getPublicUrl(fileName);

    // 2️⃣ Insert compra
    const { data: compra, error } = await supa
      .from("purchases_new")
      .insert([{
        name: nombreVal,
        phone: telefonoVal,
        email: correoVal,
        reference: referenciaVal,
        image_url: img.publicUrl,
        tickets_count: cantidad,
        raffle_id: RAFFLE_ID,
        status: "pending"
      }])
      .select()
      .single();

    if (error) throw error;

    // 3️⃣ Reservar tickets
    const { error: err2 } = await supa.rpc("reserve_tickets", {
      p_raffle_id: RAFFLE_ID,
      p_quantity: cantidad,
      p_purchase_id: compra.id
    });

    if (err2) throw err2;

    alert("✅ Compra enviada correctamente");
    location.href = "index.html";

  } catch (e) {
    console.error(e);
    alert("❌ Error enviando compra");
  }
}
</script>

</body>
</html>
