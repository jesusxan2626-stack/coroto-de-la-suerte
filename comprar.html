<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseUrl = "https://hedwnykwnhrbnwfohntr.supabase.co";
const supabaseKey = "sb_publishable_6otGMCrLs0wEi2_X5FwEmw__DDh9kRM";
const supabase = supabase.createClient(supabaseUrl, supabaseKey);

async function enviarCompra() {
  try {
    const nombre = document.getElementById("nombre").value;
    const telefono = document.getElementById("telefono").value;
    const email = document.getElementById("email").value;
    const referencia = document.getElementById("referencia").value;
    const cantidad = parseInt(document.getElementById("cantidad").value);
    const file = document.getElementById("comprobante").files[0];

    if (!nombre || !telefono || !referencia || !cantidad || !file) {
      alert("Completa todos los campos");
      return;
    }

    // 📤 Subir imagen
    const fileName = `${Date.now()}-${file.name}`;
    const { error: uploadError } = await supabase
      .storage
      .from("comprobantes")
      .upload(fileName, file);

    if (uploadError) throw uploadError;

    const image_url = `${supabaseUrl}/storage/v1/object/public/comprobantes/${fileName}`;

    // 🧾 Crear compra
    const { data: compra, error } = await supabase
      .from("purchases")
      .insert([{
        name: nombre,
        phone: telefono,
        email: email,
        reference: referencia,
        tickets_count: cantidad,
        status: "pending",
        image_url
      }])
      .select()
      .single();

    if (error) throw error;

    // 🎟 Reservar tickets
    const { error: reserveError } = await supabase.rpc("reserve_tickets", {
      p_raffle_id: 1,
      p_quantity: cantidad,
      p_order_id: compra.id
    });

    if (reserveError) throw reserveError;

    alert("✅ Compra enviada correctamente");
    location.reload();

  } catch (err) {
    console.error(err);
    alert("❌ Error enviando la compra");
  }
}
</script>
