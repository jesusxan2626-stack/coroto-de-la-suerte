<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Comprar Tickets</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0b1a33;
  color: white;
  margin: 0;
  padding: 15px;
}

.card {
  background: #122654;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 15px;
}

h1, h2 {
  text-align: center;
}

.tickets-box {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  font-size: 24px;
}

.tickets-box button {
  font-size: 30px;
  width: 60px;
  height: 60px;
  border: none;
  border-radius: 10px;
}

.total {
  text-align: center;
  font-size: 28px;
  color: #00ff88;
}

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
  font-size: 18px;
}

.btn {
  background: #00c853;
  color: black;
  font-size: 18px;
  font-weight: bold;
}
</style>
</head>
<body>

<h1>🎟 Comprar Tickets</h1>

<div class="card">
  <h2>Selecciona la cantidad</h2>
  <div class="tickets-box">
    <button onclick="cambiar(-1)">-</button>
    <span id="cantidad"></span>
    <button onclick="cambiar(1)">+</button>
  </div>
  <p class="total">Total: <span id="total">520</span>Bs</p>
</div>

<div class="card">
  <h2>🏦 Datos de pago</h2>
  <p><b>Pago móvil:</b> 04264463109</p>
  <p><b>Cédula:</b> V-3.690.403</p>
  <p><b>Banco:</b> Banco Venezuela</p>
</div>

<div class="card">
  <h2>📤 Enviar comprobante</h2>

  <input id="nombre" placeholder="Nombre completo">
  <input id="telefono" placeholder="Teléfono">
  <input id="mail" placeholder="Correo">
  <input id="referencia" placeholder="Últimos 4 dígitos">

  <input id="comprobante" type="file" accept="image/*">

  <button class="btn" id="btnEnviar" onclick="enviar()">Enviar comprobante</button>
</div>

<script>
// ================= CONFIG =================
const precio = 520;

// ⚠️ TUS DATOS SUPABASE
const supabaseUrl = "https://hedwnykwnhrbnwfohntr.supabase.co";
const supabaseKey = "sb_publishable_6otGMCrLs0wEi2_X5FwEmw__DDh9kRM";

const supa = supabase.createClient(supabaseUrl, supabaseKey);

// ================= LÓGICA =================
let cantidad = 1;
let enviando = false;

const cantidadSpan = document.getElementById("cantidad");
const totalSpan = document.getElementById("total");

function actualizar() {
  cantidadSpan.innerText = cantidad;
  totalSpan.innerText = cantidad * precio;
}

function cambiar(valor) {
  cantidad += valor;
  if (cantidad < 1) cantidad = 1;
  actualizar();
}

actualizar();

// ================= ENVIAR =================
async function enviar() {

  if (enviando) {
    alert("⏳ Ya se está enviando, espera...");
    return;
  }

  const btn = document.getElementById("btnEnviar");

  const nombre = document.getElementById("nombre").value.trim();
  const telefono = document.getElementById("telefono").value.trim();
  const correo = document.getElementById("mail").value.trim();
  const referencia = document.getElementById("referencia").value.trim();
  const comprobante = document.getElementById("comprobante").files[0];

  if (!nombre || !telefono || !referencia || !comprobante) {
    alert("⚠️ Completa todos los datos y sube el comprobante.");
    return;
  }

  try {
    // 🔒 Bloquear botón
    enviando = true;
    btn.disabled = true;
    btn.innerText = "⏳ Enviando...";

    // 📸 Nombre único real
    const nombreArchivo = crypto.randomUUID() + "_" + comprobante.name;

    // ⬆️ Subir imagen
    const { error: uploadError } = await supa
      .storage
      .from("comprobantes")
      .upload(nombreArchivo, comprobante, { upsert: false });

    if (uploadError) {
      console.error(uploadError);
      alert("❌ Error subiendo la imagen");
      throw uploadError;
    }

    // 🌐 Obtener URL pública
    const { data: publicUrlData } = supa
      .storage
      .from("comprobantes")
      .getPublicUrl(nombreArchivo);

    const imagenUrl = publicUrlData.publicUrl;

    // 💾 Guardar en BD
    const { error: insertError } = await supa
      .from("purchases")
      .insert([{
        name: nombre,
        phone: telefono,
        email: correo,
        reference: referencia,
        image_url: imagenUrl
      }]);

    if (insertError) {
      console.error(insertError);
      alert("❌ Error guardando la compra");
      throw insertError;
    }

    // ✅ Éxito
    alert(
      "✅ ¡Gracias por tu compra!\n\n" +
      "Hemos recibido tu comprobante correctamente.\n\n" +
      "En un plazo máximo de 24 horas tu pago será verificado.\n\n" +
      "¡Mucha suerte! 🍀"
    );

    // 🧹 Limpiar
    document.getElementById("nombre").value = "";
    document.getElementById("telefono").value = "";
    document.getElementById("mail").value = "";
    document.getElementById("referencia").value = "";
    document.getElementById("comprobante").value = "";

    cantidad = 1;
    actualizar();

  } catch (e) {
    console.error("Error:", e);
  } finally {
    // 🔓 Desbloquear botón
    enviando = false;
    btn.disabled = false;
    btn.innerText = "Enviar comprobante";
  }
}
</script>

</body>
</html>
