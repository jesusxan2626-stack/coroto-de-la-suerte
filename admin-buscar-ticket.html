<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Buscar Ticket</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0b1a33;
  color: white;
  margin: 0;
  padding: 15px;
}

h1 {
  text-align: center;
}

.card {
  background: #122654;
  border-radius: 12px;
  padding: 15px;
  margin-top: 15px;
}

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}

button {
  background: #00c853;
  font-weight: bold;
}

.volver {
  background: #777;
}
</style>
</head>
<body>

<script>
// 🔐 PROTECCIÓN LOGIN
if (localStorage.getItem("admin_auth") !== "ok") {
  location.href = "login.html";
}
</script>

<h1>🔎 Buscar Ticket</h1>

<button class="volver" onclick="volver()">⬅️ Volver al menú</button>

<div class="card">
  <input id="numero" placeholder="Número de ticket">
  <button onclick="buscar()">Buscar</button>
</div>

<div id="resultado"></div>

<script>
// ================= SUPABASE =================
const supabaseUrl = "https://hedwnykwnhrbnwfohntr.supabase.co";
const supabaseKey = "sb_publishable_6otGMCrLs0wEi2_X5FwEmw__DDh9kRM";
const supa = supabase.createClient(supabaseUrl, supabaseKey);

// ================= BUSCAR =================
async function buscar() {
  const num = document.getElementById("numero").value.trim();
  const div = document.getElementById("resultado");
  div.innerHTML = "";

  if (!num) {
    alert("Ingresa un número");
    return;
  }

  const { data, error } = await supa
    .from("tickets")
    .select(`
      ticket_number,
      status,
      purchases (
        name,
        phone,
        email,
        reference,
        status
      )
    `)
    .eq("ticket_number", num)
    .single();

  if (error || !data) {
    div.innerHTML = "<p style='text-align:center'>❌ Ticket no encontrado</p>";
    return;
  }

  div.innerHTML = `
    <div class="card">
      <p><b>🎟 Ticket:</b> ${data.ticket_number}</p>
      <p><b>📌 Estado:</b> ${data.status}</p>

      ${
        data.purchases ? `
        <hr>
        <p><b>👤 Nombre:</b> ${data.purchases.name}</p>
        <p><b>📞 Teléfono:</b> ${data.purchases.phone}</p>
        <p><b>📧 Email:</b> ${data.purchases.email || ""}</p>
        <p><b>💳 Referencia:</b> ${data.purchases.reference}</p>
        <p><b>🧾 Compra:</b> ${data.purchases.status}</p>
        ` : "<p>Disponible (sin comprador)</p>"
      }
    </div>
  `;
}

function volver() {
  location.href = "panel-7F3K9A2X.html";
}
</script>

</body>
</html>
