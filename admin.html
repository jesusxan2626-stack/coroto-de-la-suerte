<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Admin - Coroto</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #08162f;
  color: white;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
}

.box {
  max-width: 500px;
  margin: auto;
  background: #0f2147;
  padding: 20px;
  border-radius: 12px;
}

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}

button {
  background: #00c853;
  font-weight: bold;
}

.card {
  background: #132a57;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}

img {
  width: 100%;
  border-radius: 8px;
}
</style>
</head>
<body>

<h1>🛠 Panel de Administrador</h1>

<div class="box" id="loginBox">
  <h2>🔐 Iniciar sesión</h2>
  <input id="user" placeholder="Usuario">
  <input id="pass" type="password" placeholder="Contraseña">
  <button onclick="login()">Entrar</button>
</div>

<div class="box" id="panel" style="display:none;">
  <h2>📋 Compras</h2>
  <div id="lista"></div>
</div>

<script>
// 🔴 TUS DATOS SUPABASE
const SUPABASE_URL = "https://hedwnykwnhrbnwfohntr.supabase.co";
const SUPABASE_KEY = "sb_publishable_6otGMCrLs0wEi2_X5FwEmw__DDh9kRM";

// ✅ ASÍ SE CREA EN V2
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 🔐 CREDENCIALES DEL PANEL
const ADMIN_USER = "ShineeVE";
const ADMIN_PASS = "Vene1597538246";

function login() {
  const u = document.getElementById("user").value;
  const p = document.getElementById("pass").value;

  if (u === ADMIN_USER && p === ADMIN_PASS) {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("panel").style.display = "block";
    cargarCompras();
  } else {
    alert("❌ Usuario o contraseña incorrectos");
  }
}

async function cargarCompras() {
  const { data, error } = await client
    .from("compras")
    .select("*")
    .order("id", { ascending: false });

  if (error) {
    alert("Error cargando compras");
    console.log(error);
    return;
  }

  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  data.forEach(c => {
    lista.innerHTML += `
      <div class="card">
        <p><b>Nombre:</b> ${c.nombre}</p>
        <p><b>Teléfono:</b> ${c.telefono}</p>
        <p><b>Referencia:</b> ${c.referencia}</p>
        <p><b>Cantidad:</b> ${c.cantidad}</p>
        <p><b>Total:</b> ${c.total} Bs</p>
        <p><b>Estado:</b> ${c.estado}</p>
        <img src="${c.imagen}">
        <br><br>
        <button onclick="aprobar(${c.id})">✅ Aprobar</button>
        <button onclick="rechazar(${c.id})">❌ Rechazar</button>
      </div>
    `;
  });
}

async function aprobar(id) {
  await client.from("compras").update({ estado: "aprobado" }).eq("id", id);
  cargarCompras();
}

async function rechazar(id) {
  await client.from("compras").update({ estado: "rechazado" }).eq("id", id);
  cargarCompras();
}
</script>

</body>
</html>
