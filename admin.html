<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Administrador - Coroto de la Suerte</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1a33;
  color: white;
}

header {
  background: #08162f;
  padding: 16px;
  text-align: center;
  font-weight: bold;
  font-size: 20px;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 15px;
}

.card {
  background: #122654;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 15px;
}

h2 {
  margin-top: 0;
}

button {
  padding: 8px 12px;
  border-radius: 6px;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

.btn-approve { background: #00c853; }
.btn-reject { background: #ff5252; color: white; }
.btn-view { background: #03a9f4; color: black; }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

th, td {
  border-bottom: 1px solid #1c2f5a;
  padding: 8px;
  text-align: left;
}

img {
  max-width: 100px;
  border-radius: 8px;
}

input {
  padding: 10px;
  width: 100%;
  border-radius: 8px;
  border: none;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<header>🛠️ Administrador - Coroto de la Suerte</header>

<div class="container">

  <!-- BUSCAR GANADOR -->
  <div class="card">
    <h2>🏆 Buscar ganador por número</h2>
    <input id="winnerNumber" placeholder="Número de ticket ganador">
    <button onclick="buscarGanador()">Buscar ganador</button>
    <pre id="winnerResult"></pre>
  </div>

  <!-- COMPRAS -->
  <div class="card">
    <h2>🧾 Compras recibidas</h2>
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Teléfono</th>
          <th>Referencia</th>
          <th>Imagen</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="comprasBody"></tbody>
    </table>
  </div>

</div>

<script>
const supabaseUrl = "https://hedwnykwnhrbnwfohntr.supabase.co";
const supabaseKey = "sb_publishable_6otGMCrLs0wEi2_X5FwEmw__DDh9kRM";
const supabase = supabase.createClient(supabaseUrl, supabaseKey);

// Cargar compras
async function cargarCompras() {
  const { data, error } = await supabase
    .from("purchases")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    alert("Error cargando compras");
    console.error(error);
    return;
  }

  const tbody = document.getElementById("comprasBody");
  tbody.innerHTML = "";

  data.forEach(p => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${p.name}</td>
      <td>${p.phone}</td>
      <td>${p.reference}</td>
      <td><a href="${p.image_url}" target="_blank"><img src="${p.image_url}"></a></td>
      <td>${p.status}</td>
      <td>
        <button class="btn-approve" onclick="aprobar('${p.id}')">Aprobar</button>
        <button class="btn-reject" onclick="rechazar('${p.id}')">Rechazar</button>
      </td>
    `;

    tbody.appendChild(tr);
  });
}

// Aprobar
async function aprobar(id) {
  if (!confirm("¿Aprobar este pago?")) return;

  const { error } = await supabase.rpc("approve_purchase", { p_purchase_id: id });

  if (error) {
    alert("Error aprobando");
    console.error(error);
  } else {
    alert("✅ Compra aprobada y tickets asignados");
    cargarCompras();
  }
}

// Rechazar
async function rechazar(id) {
  if (!confirm("¿Rechazar este pago y liberar tickets?")) return;

  const { error } = await supabase.rpc("reject_purchase", { p_purchase_id: id });

  if (error) {
    alert("Error rechazando");
    console.error(error);
  } else {
    alert("❌ Compra rechazada y tickets liberados");
    cargarCompras();
  }
}

// Buscar ganador
async function buscarGanador() {
  const n = document.getElementById("winnerNumber").value;

  if (!n) return alert("Pon un número");

  const { data, error } = await supabase.rpc("find_winner", { p_ticket_number: parseInt(n) });

  if (error) {
    console.error(error);
    alert("Error buscando ganador");
    return;
  }

  const out = document.getElementById("winnerResult");

  if (!data || data.length === 0) {
    out.textContent = "❌ Ese número no está vendido.";
  } else {
    out.textContent = JSON.stringify(data[0], null, 2);
  }
}

// Inicial
cargarCompras();
</script>

</body>
</html>
