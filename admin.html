<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin - Coroto de la Suerte</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body { margin:0; font-family:Arial; background:#0b1a33; color:white; }
header { background:#08162f; padding:15px; text-align:center; font-size:22px; font-weight:bold; }
.container { max-width:1000px; margin:auto; padding:15px; }
.card { background:#122654; border-radius:12px; padding:15px; margin-bottom:15px; }
table { width:100%; border-collapse: collapse; font-size:14px; }
th, td { padding:8px; border-bottom:1px solid #223a6b; text-align:center; }
button { padding:8px 12px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; }
.ok { background:#00c853; }
.bad { background:#ff5252; }
.view { background:#2196f3; color:white; }
input { padding:10px; border-radius:8px; border:none; width:100%; margin-top:10px; }
</style>
</head>

<body>

<header>🛠️ Admin - Coroto de la Suerte</header>

<div class="container">

<!-- BUSCAR GANADOR -->
<div class="card">
  <h2>🎯 Buscar Ticket Ganador</h2>
  <input id="winnerNumber" type="number" placeholder="Número ganador">
  <button class="view" onclick="buscarGanador()">Buscar ganador</button>
  <pre id="winnerResult"></pre>
</div>

<!-- LISTA DE COMPRAS -->
<div class="card">
  <h2>📋 Compras pendientes</h2>
  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Teléfono</th>
        <th>Referencia</th>
        <th>Imagen</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody id="tablaCompras"></tbody>
  </table>
</div>

</div>

<script>
// ⚠️ TUS DATOS
const supabaseUrl = "https://hedwnykwnhrbnwfohntr.supabase.co";
const supabaseKey = "sb_publishable_6otGMCrLs0wEi2_X5FwEmw__DDh9kRM";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

// ================== CARGAR COMPRAS ==================
async function cargarCompras() {
  const { data, error } = await supabase
    .from("purchases")
    .select("*")
    .eq("status", "pending")
    .order("created_at", { ascending: true });

  if (error) {
    alert("Error cargando compras");
    console.error(error);
    return;
  }

  const tabla = document.getElementById("tablaCompras");
  tabla.innerHTML = "";

  for (let compra of data) {
    tabla.innerHTML += `
      <tr>
        <td>${compra.name}</td>
        <td>${compra.phone}</td>
        <td>${compra.reference}</td>
        <td><a class="view" href="${compra.image_url}" target="_blank">Ver</a></td>
        <td>
          <button class="ok" onclick="aprobar('${compra.id}')">Aprobar</button>
          <button class="bad" onclick="rechazar('${compra.id}')">Rechazar</button>
        </td>
      </tr>
    `;
  }
}

// ================== APROBAR ==================
async function aprobar(id) {
  if (!confirm("¿Aprobar esta compra?")) return;

  const { error } = await supabase
    .from("purchases")
    .update({ status: "approved" })
    .eq("id", id);

  if (error) {
    alert("Error aprobando");
    console.error(error);
    return;
  }

  alert("✅ Compra aprobada");
  cargarCompras();
}

// ================== RECHAZAR ==================
async function rechazar(id) {
  if (!confirm("¿Rechazar esta compra?")) return;

  const { error } = await supabase
    .from("purchases")
    .update({ status: "rejected" })
    .eq("id", id);

  if (error) {
    alert("Error rechazando");
    console.error(error);
    return;
  }

  alert("❌ Compra rechazada");
  cargarCompras();
}

// ================== BUSCAR GANADOR ==================
async function buscarGanador() {
  const numero = document.getElementById("winnerNumber").value;
  if (!numero) return alert("Escribe el número ganador");

  const { data, error } = await supabase
    .rpc("find_winner", { p_ticket_number: parseInt(numero) });

  if (error) {
    alert("Error buscando ganador");
    console.error(error);
    return;
  }

  if (data.length === 0) {
    document.getElementById("winnerResult").innerText = "❌ Ese ticket no está vendido.";
    return;
  }

  document.getElementById("winnerResult").innerText = JSON.stringify(data[0], null, 2);
}

// ================== INIT ==================
cargarCompras();
</script>

</body>
</html>
